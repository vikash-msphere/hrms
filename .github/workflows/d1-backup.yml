name: d1-backup
# Nightly logical export of the production D1 to R2 (retention beyond D1 Time Travel's 30-day window). The
# Workers runtime has no D1 export API, so this must run from CI, not the Worker. See docs/deploy.md
# "Backups & disaster recovery".
#
# The dump is NEVER stored on GitHub - no artifact, no cache. It is the whole production database in plain SQL,
# and anything uploaded here is downloadable by everyone with read access to the repo. It exists on the runner
# only for the seconds between the export and the upload, and the runner is discarded after the job.
on:
  schedule:
    - cron: "30 3 * * *" # 03:30 UTC, after the 02:00 nightly accrual/reminders cron has settled
  workflow_dispatch: {}

concurrency:
  group: d1-backup-production
  cancel-in-progress: false

# The job only reads the tree. Declared, not inherited, so the token cannot write whatever the repo default is.
permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Pinned to a commit, not a tag (see verify.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24" # same major as verify.yml, which says why
      - run: npm ci
      # wrangler validates `[assets].directory` on every subcommand, so the d1/r2 calls below need
      # web/dist to exist. This job uploads no assets, so an empty directory is enough - no SPA build.
      - run: mkdir -p web/dist
      - name: Export production D1
        run: |
          STAMP="$(date -u +%F)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          npx wrangler d1 export hrms --remote --output="hrms-$STAMP.sql"
      # The one copy: the existing DOCS bucket, under a backups/ prefix. r2-backup.yml leaves that prefix out
      # of its copy to hrms-backup, and retention is an R2 lifecycle rule on `backups/`.
      - name: Upload export to R2
        run: npx wrangler r2 object put "hrms/backups/db/hrms-${STAMP}.sql" --file="hrms-${STAMP}.sql" --remote
