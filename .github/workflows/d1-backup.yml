name: d1-backup
# Nightly snapshot of the production D1 to R2 (retention beyond D1 Time Travel's window: 7 days on Workers Free,
# 30 on Paid). It runs from CI, not the Worker: a Free-plan invocation gets 10 ms of CPU and 50 queries, far short
# of reading and checking the whole database. See docs/deploy.md "Backups & disaster recovery".
#
# The dump is NEVER stored on GitHub - no artifact, no cache. It is the whole production database as SQL, and
# anything uploaded here is downloadable by everyone with read access to the repo. It exists on the runner only
# for the seconds between the snapshot and the upload, and the runner is discarded after the job.
on:
  schedule:
    - cron: "7 22 * * *" # 22:07 UTC = 03:37 IST, when nobody is clocking in or approving
  workflow_dispatch: {}

concurrency:
  group: d1-backup-production
  cancel-in-progress: false

# The job only reads the tree. Declared, not inherited, so the token cannot write whatever the repo default is.
permissions:
  contents: read

jobs:
  backup:
    # prod only. A schedule cannot name a branch: GitHub fires it from the default branch, and it kept firing
    # on `dev` after the default moved to `prod`. A manual dispatch can also pick any branch. This skips the
    # job on every ref but prod.
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Pinned to a commit, not a tag (see verify.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24" # same major as verify.yml, which says why
      - run: npm ci
      # wrangler validates `[assets].directory` on every subcommand, so the d1/r2 calls below need
      # web/dist to exist. This job uploads no assets, so an empty directory is enough - no SPA build.
      - run: mkdir -p web/dist
      # Not `wrangler d1 export`: D1 refuses to export a database that holds a virtual table, and the search
      # index `search_fts` is one. The script reads every table in ONE D1 transaction, restores the dump into a
      # scratch SQLite and checks it, and writes the file only when every check passes - so a failed check fails
      # this step and nothing is uploaded. Its header says what the dump holds and how to restore it.
      - name: Snapshot production D1
        run: |
          STAMP="$(date -u +%F)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          node --import ./scripts/tsResolve.mjs scripts/d1Backup.ts --out "hrms-$STAMP.sql.gz"
      # The one copy: the hrms-backup bucket, under db/, apart from the documents r2-backup.yml copies in as
      # <collection>/<id>. Retention is an R2 lifecycle rule on the `db/` prefix of hrms-backup.
      - name: Upload snapshot to R2
        run: npx wrangler r2 object put "hrms-backup/db/hrms-${STAMP}.sql.gz" --file="hrms-${STAMP}.sql.gz" --content-type application/gzip --remote
