name: verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not 20: the tree needs it (@zxing/library >= 24; wrangler, miniflare, pdfjs-dist >= 22), and Node 20's
          # npm 10 refuses the npm 11 lockfile in `npm ci` as "not in sync". Keep every workflow on the same major.
          node-version: "24"
      - run: npm ci
      # Single gate: spectral (--fail-severity=warn) + tsc + vitest. Fails the build on any warning.
      - run: npm run verify
