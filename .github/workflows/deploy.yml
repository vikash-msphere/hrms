name: deploy
on:
  push:
    branches: [prod]
  workflow_dispatch: {}

# Never let two deploys race the same D1 / Worker.
concurrency:
  group: deploy-production
  cancel-in-progress: false

# The job only reads the tree; the deploy itself goes through CLOUDFLARE_API_TOKEN, not the GitHub token.
# Declared, not inherited, so the token cannot write whatever the repo default is.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Pinned to a commit, not a tag (see verify.yml). This job holds the Cloudflare token, so it is the one
      # where a moved tag would cost the most.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24" # same major as verify.yml, which says why
      - run: npm ci
      # ONE release string for the whole deploy, resolved once. Both halves of a distributed trace have to
      # claim the SAME release or the SPA's span and the Worker's span land on two, and only one of them has
      # source maps - which is the state every deploy was in, because nothing set either value. The short SHA
      # is what `resolveAppVersion` (web/vite.config.ts) and `gitRelease` (scripts/preflight.ts) already fall
      # back to, so using it here makes all three agree by construction rather than by coincidence.
      - name: Resolve the release
        run: echo "RELEASE=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      # Config gate FIRST: preflight catches a REPLACE_WITH_* placeholder, a [limits]/CF_PLAN mismatch and a
      # malformed VAPID key - mistakes no build or test can see, and which otherwise only surface in
      # production. `npm run deploy` chains it locally; this is the same gate for the CI path.
      # CF_PLAN must match the Cloudflare plan this account is actually on. It defaults to "free", which is the
      # plan in use (wrangler.toml has `[limits]` commented out to match). On moving to Workers Standard, set the
      # `production` environment variable CF_PLAN=paid AND uncomment `[limits]` in both wrangler configs -
      # preflight fails the deploy if the two disagree.
      #
      # The _CONFIRMED values are dated acknowledgements of edge controls configured in the Cloudflare
      # DASHBOARD, which a preflight cannot read for itself (no binding for the zone, no token to ask with) -
      # see the note in scripts/preflight.ts. They are plumbed from repository VARIABLES so that confirming
      # them is a one-line change in GitHub rather than an edit to this workflow, and so an expired
      # acknowledgement fails the deploy here instead of being silently carried. Set them, once the rules in
      # docs/deploy-security.md §1 and zone HSTS are actually in place, to the ISO date you verified them.
      # EDGE_RULE_CONFIRMED (the media rule, docs/deploy.md) only warns while unset: that rule can only be
      # switched on after a deploy has handed browsers the cookie it checks.
      - run: npm run preflight
        env:
          CF_PLAN: ${{ vars.CF_PLAN || 'free' }}
          WAF_RATE_LIMIT_CONFIRMED: ${{ vars.WAF_RATE_LIMIT_CONFIRMED }}
          HSTS_CONFIRMED: ${{ vars.HSTS_CONFIRMED }}
          EDGE_RULE_CONFIRMED: ${{ vars.EDGE_RULE_CONFIRMED }}
          SENTRY_RELEASE: ${{ env.RELEASE }}
          VITE_APP_VERSION: ${{ env.RELEASE }}
          # Preflight only checks that the token is SET (it warns when source maps would not upload); the
          # upload itself is the build:web step's. A secret reaches a step only through its own `env:` - being
          # in the `production` environment is not enough - so without this line preflight warned "not set"
          # on every deploy, even with the secret configured.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      # No `npm run verify` here, deliberately: verify runs only when somebody asks for it (verify.yml, manual,
      # any branch). Run it on the commit being released BEFORE pushing to `prod` - this workflow ships whatever
      # it is given, and preflight above checks config only, not code.
      # Build the SPA BEFORE any wrangler command: wrangler validates `[assets].directory` on every
      # subcommand (including `d1 migrations apply`), so a missing web/dist fails the migration step.
      #
      # SENTRY_AUTH_TOKEN is what turns source maps on at all: web/vite.config.ts ties `sourcemap` and the
      # upload plugin to its presence deliberately (so maps are never left in web/dist to be served as public
      # assets). Without it every production stack trace arrives as `index-a1b2c3.js:1:48213`. Absent secret =
      # no upload and no maps, exactly as before - so this is safe to wire before the secret exists.
      - run: npm run build:web
        env:
          VITE_APP_VERSION: ${{ env.RELEASE }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
      # Idempotent: wrangler skips migrations already recorded in the remote D1.
      - run: npm run db:migrate:remote
      # The Worker is built ONCE, given Sentry debug IDs, and that exact file is what gets uploaded. The build
      # is minified (wrangler.toml `minify`), so without maps a production stack trace is one long line; a
      # debug ID ties each frame to its map whatever path the runtime reports, which release-plus-filename
      # matching cannot promise for a Worker. Injecting is local and needs no token, so it always runs, and
      # the bundle ships the same whether or not the maps upload.
      - name: Build the Worker
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir dist-worker
      - name: Inject Sentry debug IDs
        run: npx sentry-cli sourcemaps inject dist-worker
      # Uploads the Worker built above + web/dist assets, registers crons. `--no-bundle` so wrangler ships the
      # injected file instead of rebuilding from src (which would drop the debug IDs).
      #
      # `--minify=false` because that file is already minified (the build step read wrangler.toml `minify`), and
      # an unbundled upload cannot be minified again: left to the config value, wrangler warns that `--minify`
      # and `--no-bundle` can't be used together and ships the file unchanged anyway.
      #
      # `--config wrangler.toml` because a script path given on the command line makes wrangler look for its
      # config next to that script. wrangler.toml IS production, and staging is a separate file
      # (wrangler.staging.toml) that this workflow must never reach.
      #
      # `--var` MERGES with the `[vars]` block rather than replacing it (verified against
      # `wrangler deploy --dry-run`: every configured var survives alongside this one), which is what makes
      # this the right place for the release. wrangler.toml deliberately does NOT carry SENTRY_RELEASE - a
      # literal there is the same string for every deploy, which is how every release ended up tagged "0.1.0".
      - run: npx wrangler deploy dist-worker/index.js --config wrangler.toml --no-bundle --minify=false --var SENTRY_RELEASE:"$RELEASE"
      # After the deploy and allowed to fail: a missing map costs readable stack traces, never the release.
      # Skipped without the secret, like the SPA's upload in build:web.
      - name: Worker source maps
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "SENTRY_AUTH_TOKEN not set - Worker source maps not uploaded"; exit 0; fi
          npx sentry-cli sourcemaps upload --release "$RELEASE" dist-worker
