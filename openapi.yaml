  /v1/search:
    get:
      description: "Global search across every collection the caller may list. Each collection is included only if the caller's list decision for it allows, and its rows are filtered by that collection's own list scope, so a hit is always a row the caller could already have listed."
      operationId: "SearchAll"
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: "Search text. Absent, or fewer than 2 characters, returns no results."
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string, description: "Resource ref, e.g. employees/{employee}." }
                        collection: { type: string, description: "Wire collection the hit belongs to." }
                        title: { type: [string, 'null'] }
                        subtitle: { type: [string, 'null'] }
                x-aep-resource:
                  singular: search-result-set
                  plural: search-result-sets
                  singleton: true
                  patterns:
                    - 'search'
                  type: hrms.example.com/search-result-set
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/changes:
    get:
      description: "Which collections have been written to since a given moment, so a client can keep everything it has stored instead of re-reading it. Answers from a per-collection change stamp maintained by database triggers, so it sees every write - from a service, a cron, the automation engine or hand-run SQL. A collection is named only if the caller may list it. Any age of `since` is answered (the stamps are current state, not history); without a usable reference point the answer is `unknown_window: true` and no collections are listed, and the client should revalidate normally instead of trusting what it has stored."
      operationId: "GetChanges"
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: integer }
          description: "Epoch milliseconds to compare against - the `now` from a previous answer. Absent, zero or not a number yields `unknown_window`; there is no maximum age."
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: integer, description: "The server's clock at the moment of the answer. Send this as `since` next time." }
                  collections:
                    type: array
                    description: "Wire collections written to in the window, filtered to those the caller may list. Absent when `unknown_window` is true."
                    items: { type: string }
                  unknown_window: { type: boolean, description: "True when there is no usable reference point to compare against; no collections are listed." }
                x-aep-resource:
                  singular: change-set
                  plural: change-sets
                  singleton: true
                  patterns:
                    - 'changes'
                  type: hrms.example.com/change-set
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/activity-counts:
    get:
      description: "How many rows have appeared in each named collection since a given moment - the workspace tab bar's \"new since you last looked\" badges. A collection is included only if the caller's list decision for it allows, and the count is bound by that collection's own list scope, so it equals what the caller would have counted from the list response. Counts only; no rows are returned."
      operationId: "GetActivityCounts"
      parameters:
        - name: tabs
          in: query
          required: false
          schema: { type: string }
          description: "Comma-separated `<collection>:<sinceEpochMs>` pairs, e.g. `boards:1712000000000,goals:1712000000000`. Unknown collections and malformed pairs are ignored; at most 24 pairs are answered."
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }
                    description: "Wire collection -> number of rows created after the given moment. Absent means nothing new, or nothing the caller may list."
                x-aep-resource:
                  singular: activity-count-set
                  plural: activity-count-sets
                  singleton: true
                  patterns:
                    - 'activity-counts'
                  type: hrms.example.com/activity-count-set
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/people-analytics:
    get:
      description: "One report row per person over a window - attendance and punctuality, leave, tasks, goals, performance, time and effort. A measure is included only if the caller's list decision for its backing collection allows (and for a derived measure, every collection it leans on), and each aggregate is bound by that collection's own list scope - so every number equals what the caller would have counted from the list response. The people are exactly the employees their own directory list would return. Measures the caller may not see are absent from `metrics` and from every row."
      operationId: "GetPeopleAnalytics"
      parameters:
        - name: from
          in: query
          required: false
          schema: { type: string, format: date }
          description: "First day of the window (YYYY-MM-DD). Defaults to the first of the current month."
        - name: to
          in: query
          required: false
          schema: { type: string, format: date }
          description: "Last day of the window (YYYY-MM-DD; inclusive). Defaults to today. The window may not exceed 92 days."
        - name: department
          in: query
          required: false
          schema: { type: string }
          description: "Limit the report to one department (`departments/{id}`)."
        - name: employee
          in: query
          required: false
          schema: { type: string }
          description: "Report on one person only (`employees/{id}`). Narrows the roster; it never widens it - the caller's own employee visibility still decides. A single named person may be asked for over a window of up to 400 days."
        - name: series
          in: query
          required: false
          schema: { type: boolean }
          description: "With `employee`, also return that person's day-by-day attendance (`series`) - what a calendar heatmap draws."
        - name: max_people
          in: query
          required: false
          schema: { type: integer }
          description: "How many people to report on (default 100; 200 max). `truncated` says whether more were in scope."
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [window, groups, metrics, people, team, truncated]
                properties:
                  window:
                    type: object
                    required: [from, to, timezone, working_days]
                    properties:
                      from: { type: string, format: date }
                      to: { type: string, format: date }
                      timezone: { type: string, description: "The org timezone the punches were read in." }
                      working_days: { type: integer, description: "Scheduled working days in the window - the denominator behind the attendance figures." }
                  groups:
                    type: array
                    description: "The dimensions the measures fall into, in display order."
                    items:
                      type: object
                      required: [key, label]
                      properties:
                        key: { type: string }
                        label: { type: string }
                  metrics:
                    type: array
                    description: "The measures this caller may see, in column order. Each carries how to read and roll it up so a client needs no table of its own."
                    items:
                      type: object
                      required: [key, label, short, group, collection, unit, agg, direction, hint]
                      properties:
                        key: { type: string }
                        label: { type: string }
                        short: { type: string, description: "Compact column header." }
                        group: { type: string, description: "Which `groups` entry this belongs to." }
                        collection: { type: string, description: "The collection whose list decision gated it." }
                        needs:
                          type: array
                          description: "Further collections a derived measure required."
                          items: { type: string }
                        unit: { type: string, enum: [count, days, hours, minutes, percent, rating, time_of_day] }
                        agg: { type: string, enum: [sum, avg], description: "How the measure rolls up to the team line." }
                        direction: { type: string, enum: [higher, lower, none], description: "Which way is good." }
                        hint: { type: string, description: "Exactly what was counted." }
                  people:
                    type: array
                    items:
                      type: object
                      required: [employee, name, values]
                      properties:
                        employee: { type: string, description: "`employees/{id}`" }
                        name: { type: string }
                        employee_number: { type: string, nullable: true }
                        job_title: { type: string, nullable: true }
                        department: { type: string, nullable: true, description: "`departments/{id}`" }
                        manager: { type: string, nullable: true, description: "`employees/{id}`" }
                        values:
                          type: object
                          description: "Measure key -> number. Null means the measure has no value for this person (no present days to average an arrival over, no rated review yet)."
                          additionalProperties: { type: number, nullable: true }
                  team:
                    type: object
                    description: "The team line: each measure summed or averaged across the people who have a number for it."
                    additionalProperties: { type: number, nullable: true }
                  truncated: { type: boolean, description: "More people were in scope than `max_people` allowed." }
                  series:
                    type: array
                    description: "Present only when one `employee` was asked for with `series=true`: their attendance day by day, oldest first. Days with no punch are absent."
                    items:
                      type: object
                      required: [day, worked_minutes, late]
                      properties:
                        day: { type: string, format: date }
                        worked_minutes: { type: number, description: "Minutes on closed sessions that day." }
                        late: { type: boolean, description: "The first punch landed past the shift start plus that day's grace." }
                x-aep-resource:
                  singular: people-analytics
                  plural: people-analytics-set
                  singleton: true
                  patterns:
                    - 'people-analytics'
                  type: hrms.example.com/people-analytics
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/dashboard-summary:
    get:
      description: "Aggregated dashboard KPI counts. Each KPI is included only if the caller's list decision for its backing collection allows, and its COUNT/SUM is bound by that collection's own list scope - so every number equals what the caller would have counted from the list response. KPIs the caller may not see are absent from the map."
      operationId: "GetDashboardSummary"
      parameters:
        - name: keys
          in: query
          required: false
          schema: { type: string }
          description: "Comma-separated KPI keys to compute (e.g. open_tickets,cards_blocked). Empty computes every KPI the caller may see."
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  kpis:
                    type: object
                    description: "KPI key -> aggregate. `value` is the card's number; `extra` is the key-specific companion number its hint shows (a money total, an of-N denominator, a today/overdue sub-count)."
                    additionalProperties:
                      type: object
                      required: [value]
                      properties:
                        value: { type: number }
                        extra: { type: number }
                x-aep-resource:
                  singular: dashboard-summary
                  plural: dashboard-summaries
                  singleton: true
                  patterns:
                    - 'dashboard-summary'
                  type: hrms.example.com/dashboard-summary
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/approvals-summary:
    get:
      description: "How many items in each approval queue are waiting for the caller's decision. A queue is included only if the caller may `approve` in it, and its COUNT is bound by that same approve scope - so every number equals what the caller would have counted from the queue itself. Rows are not returned: the pages that display queues read the collections directly."
      operationId: "GetApprovalsSummary"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required: [counts, total]
                properties:
                  counts:
                    type: object
                    description: "Queue -> how many rows await this caller's decision. Keys are collection ids (leave-requests, expenses, ...) plus `tax-verifications` for the prior-employer verification queue. A queue the caller cannot approve in is absent."
                    additionalProperties: { type: number }
                  total: { type: number, description: "Sum of every included queue - the number the sidebar badge renders." }
                x-aep-resource:
                  singular: approvals-summary
                  plural: approvals-summaries
                  singleton: true
                  patterns:
                    - 'approvals-summary'
                  type: hrms.example.com/approvals-summary
        '500': { $ref: '#/components/responses/Problem' }
