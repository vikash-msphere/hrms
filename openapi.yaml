                  maxItems: 100
                  items:
                    type: object
                    required: [name]
                    properties:
                      name: { type: string }
                      category: { type: string, description: "asset-categories/{id}." }
                      serial_number: { type: string, description: "Identifies ONE device, so it cannot be combined with a quantity above 1." }
                      purchase_date: { type: string, format: date }
                      notes: { type: string }
                      quantity: { type: integer, minimum: 1, maximum: 100, description: "How many identical things this line stands for (default 1). One asset row is created per thing." }
