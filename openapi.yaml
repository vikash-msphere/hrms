    announcement:
      type: object
      required: [path, create_time, update_time, etag, body_text, read, reactions, replies, reply_count]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the resource, unique within the service.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        delete_time: { type: string, format: date-time, readOnly: true }
        kind: { type: string, description: "announcement (official, write-gated), post (generic board post), poll (a post with vote options), or kudos (peer recognition about a recipient). Defaults to announcement." }
        recipient: { type: string, description: "Kudos only (kind=kudos): employees/{employee_id} being recognized (mutually exclusive with recipient_department)." }
        recipient_department: { type: string, description: "Kudos only: departments/{department_id} recognized as a whole team (mutually exclusive with recipient); fanned out as a notification to every member, no per-head leaderboard points." }
        audience_scope:
          type: string
          enum: [everyone, department, none]
          description: >-
            Who gets NOTIFIED when the post goes live: the whole company (default), one department
            (`audience_department`, which is then required), or nobody - a notice that only needs to be on the
            wall. This is an AUDIENCE, not a permission: on all three settings the board stays readable by
            anyone who can read announcements, and what changes is the fan-out plus the label on the card.
            Settable while the post is a draft; not applicable to kudos.
        audience_department:
          type: string
          description: >-
            Resource path: departments/{department_id}. The department notified when `audience_scope` is
            `department`, and the label the card carries so the other departments can see the post is not aimed
            at them. Required with that scope, ignored on the others.
        email_audience:
          type: boolean
          description: >-
            Send the post to its audience as email when it goes live, on top of the in-app broadcast. Sent once -
            a manual publish racing the scheduler cannot email twice. Rejected with `audience_scope: none`, since
            an email is a notification. Settable while the post is a draft.
        email_time: { type: string, format: date-time, readOnly: true, description: "When the email went out, if it did." }
        value: { type: string, description: "Kudos only: optional company value tag (e.g. Teamwork)." }
        category: { type: string, description: "Kudos only: optional HR-configurable category (settings/kudos)." }
        level: { type: string, description: "Kudos only: optional recognition level/tier (settings/kudos)." }
        points: { type: integer, readOnly: true, description: "Kudos only: point weight of the level, snapshotted server-side; feeds the leaderboard." }
        illustration: { type: string, maxLength: 120, description: "Art on the card, on any kind - either a `<category>/<slug>` path into the bundled illustration set, or a `<file>.png` brand sticker, told apart by the suffix. Absent means no art. (Writing a kudos suggests one of its category's stickers, but that is stored like any other pick and can be removed.)" }
        recipient_layout:
          type: object
          description: "Kudos only: where the recipient block (avatar + name) sits and how wide it is, once the giver has placed it. Fractions of the card's width, 0 flush left/top to 1 flush right/bottom. No opacity. Absent = the card's own layout decides."
          required: [x, y, size]
          properties:
            x: { type: number }
            y: { type: number }
            size: { type: number }
            wrap: { type: string, enum: [inline, square, tight, through, top-bottom, behind, front], description: "How the card's words behave around it, in word-processor terms: inline (its own column), square/tight/through (text flows around it, on the side its x favours), top-bottom (its own band, text above and below), behind or front (floating over the card at x/y). Absent = the card's own default." }
        illustration_layout:
          type: object
          description: "Where the sticker sits on the card, set once an author has moved, resized or faded it. Absent means the default: the sticker flows inline beside the message. Every value is a FRACTION of the card's own width, never pixels, so one placement holds at any card size."
          required: [x, y, size, opacity]
          properties:
            x: { type: number, description: "Horizontal anchor, 0 (flush left) to 1 (flush right)." }
            y: { type: number, description: "Vertical anchor, 0 (flush top) to 1 (flush bottom)." }
            size: { type: number, description: "Width as a share of the card's width (0.05-1)." }
            opacity: { type: number, description: "0.05 (barely there) to 1 (solid)." }
            wrap: { type: string, enum: [inline, square, tight, through, top-bottom, behind, front], description: "How the card's words behave around it, in word-processor terms: inline (its own column), square/tight/through (text flows around it, on the side its x favours), top-bottom (its own band, text above and below), behind or front (floating over the card at x/y). Absent = the card's own default." }
        title: { type: string }
        body: { type: string, description: "Markdown-lite source: `**bold**`, `*italic*`, `***both***`, `~~strike~~`, `` `code` ``, `[text](url)`, `- `/`1. ` lists, `> ` quotes, `#`-`###` headings, `---` rules, plus a block attribute line (`{center lg serif}`) carrying alignment, type size (sm/base/lg) and typeface. Rendered to elements, never to HTML." }
        body_text: { type: string, readOnly: true, description: "The body with its markup stripped, derived server-side. What the search index, notification excerpts and list teasers use." }
        title_align: { type: string, enum: [left, center, right], description: "How the card heading is aligned. Absent = start-aligned. The title is its own field, so unlike a body block it cannot carry a `{center}` attribute line." }
        body_valign: { type: string, enum: [top, middle, bottom], description: "Where the words sit VERTICALLY in the card. Only visible when the card is taller than its text - which is what a placed sticker does to one. Absent = middle (the card centres everything by default); send \"top\" to pin the words to the top." }
        options:
          type: array
          writeOnly: true
          description: "Poll choices (>=2) when creating a poll. Read results back via the `poll` object."
          items: { type: string }
        multiple: { type: boolean, writeOnly: true, description: "Poll only: allow a voter to pick more than one option." }
        closes_time: { type: string, format: date-time, writeOnly: true, description: "Poll only: optional deadline after which voting is locked." }
        poll:
          type: object
          readOnly: true
          description: "Present on a poll (kind=poll): its options, anonymous tallies, and state."
          required: [options, closed, total_votes, voted]
          properties:
            multiple: { type: boolean, description: "Whether a voter may pick more than one option." }
