    access-rule:
      type: object
      description: >-
        One access-control rule for a subject (a role OR a user) - the single authority primitive; roles and
        users are managed identically. On create, the server derives the verbatim pattern + narrowing columns
        from the structured fields; server-derived fields are read-only.
      properties:
        path:
          type: string
          description: The server-assigned path of the rule (access-rules/{access_rule_id}).
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        subject_kind: { type: string, description: "'role' or 'user'." }
        subject: { type: string, description: "Role name (subject_kind=role) or users/{user_id} (subject_kind=user)." }
        collection: { type: string, description: The collection this rule applies to. }
        scope: { type: string, description: "all | self | dept | subtree | exact." }
        scope_ref: { type: string, description: "For scope=exact: the {collection}/{id} the rule is anchored to (server resolves to a code)." }
        field: { type: string, description: "Optional protected field this rule governs (field-level write)." }
        level: { type: string, description: "Standard-method level (read|write|admin). Mutually exclusive with verb; omit when effect=deny." }
        verb: { type: string, description: "Custom-method name (e.g. approve, download). Mutually exclusive with level. No ladder; fail-closed." }
        effect: { type: string, description: "'allow' (default) or 'deny' (deny wins outright, for a level or a verb)." }
      x-aep-resource:
        singular: access-rule
        plural: access-rules
        patterns:
          - 'access-rules/{access_rule_id}'
        type: hrms.example.com/access-rule
    policy:
      type: object
      properties:
        path:
          type: string
          description: The server-assigned path of the policy document (policy/{policy_id}; e.g. policy/manifest).
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        key: { type: string, description: The policy document key (e.g. "manifest"). }
        value:
          type: object
          description: >-
            The body-access-control manifest. Required keys when key=manifest: protected_fields, references,
            owner_refs, state_visibility, audit. Strictly validated on write (a malformed body is rejected).
      x-aep-resource:
        singular: policy
        plural: policies
        patterns:
          - 'policy/{policy_id}'
        type: hrms.example.com/policy
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
paths:
  /v1/users:
    get:
      description: List method for user.
      operationId: ListUsers
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
