openapi: 3.1.0
info:
  title: HRMS API
  description: Internal HR API following aep.dev resource-oriented design.
  version: "1.0.0"
  contact: { name: HRMS Team, email: hrms@example.com }
servers: [{ url: https://hrms.example.com }]
components:
  schemas:
    access_hint:
      type: object
      readOnly: true
      description: >-
        Per-object access hint computed by the server's decision engine for the
        calling user: `can` lists the verbs the caller may perform on THIS object
        (e.g. update, delete, approve). UX ONLY - every request is still enforced
        server-side; this gates nothing. Absent when not computed for the collection.
      properties:
        can:
          type: array
          items: { type: string }
        why:
          type: string
          enum: [all, subtree, exact, self, dept]
          description: >-
            The scope by which the caller holds READ on this object, shown as provenance.
            Absent when the object carries no addressable code to resolve a scope against.
    Problem:
      title: An RFC 9457 problem object
      type: object
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 100, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        fields:
          type: array
          description: >-
            Which request fields were rejected, on a body validation failure. The names are the ones in this
            document, so a client can show each message on the field it belongs to; the values that were sent
            are never echoed back.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string, description: "Dotted path of the rejected field, e.g. `weight` or `sessions.0.start_time`." }
              message: { type: string, description: "What was wrong with it." }
    operation:
      type: object
      required: [path, done, metadata]
      properties:
        path: { type: string, readOnly: true, description: The server-assigned path of the operation. }
        done: { type: boolean, readOnly: true, description: "True once the operation has finished, successfully or not." }
        error:
          readOnly: true
          description: "Set when the operation failed; absent otherwise."
          $ref: '#/components/schemas/Problem'
        response:
          type: object
          readOnly: true
          additionalProperties: true
          description: "The operation's result, shaped by its kind. Present only on success."
        metadata:
          type: object
          readOnly: true
          required: [status]
          description: "Admin-facing detail, kept out of the LRO contract (path/done/error/response) proper."
          properties:
            kind: { type: string, description: "What the job does (the queue handler that owns it)." }
            status: { type: string, enum: [queued, running, done, error], description: "Live job state; done/error both mean the operation has finished." }
            attempts: { type: integer, description: "How many times the job has been picked up." }
            create_time: { type: string, format: date-time }
            update_time: { type: string, format: date-time }
      x-aep-resource:
        singular: operation
        plural: operations
        patterns:
          - 'operations/{operation_id}'
        type: hrms.example.com/operation
    cron_run:
      type: object
      required: [create_time, update_time, etag, start_time]
      properties:
        path: { type: string, description: The server-assigned path of the cron run. }
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        cron: { type: string, description: The cron expression that fired. }
        status: { type: string, description: running | done | error. }
        start_time: { type: string, format: date-time, readOnly: true }
        end_time: { type: string, format: date-time, readOnly: true }
        duration_ms: { type: integer, readOnly: true }
        error: { type: string, readOnly: true }
        summary: { type: object, readOnly: true, description: Per-tick result counts. }
      x-aep-resource:
        singular: cron-run
        plural: cron-runs
        patterns: ['cron-runs/{cron_run}']
        type: hrms.example.com/cron-run
    automation:
      type: object
      required: [path, create_time, update_time, etag]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the automation rule.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        delete_time: { type: string, format: date-time, readOnly: true }
        disabled: { type: boolean, readOnly: true }
        locked: { type: boolean, readOnly: true }
        locked_by: { type: string, readOnly: true }
        name: { type: string, description: Human-readable rule name. }
        description: { type: string }
        trigger_type: { type: string, description: The domain event type that fires this rule (see workflow-meta events). }
        condition:
          type: [object, 'null']
          additionalProperties: true
          description: "JSON predicate, or null for always-match: a comparison {field, op, value} or an all/any/not composite. Validated in depth server-side."
        actions:
          type: array
          items: { type: object, additionalProperties: true }
          description: Ordered action list (notify / notifyManager / notifyAudience / apiCall / emitEvent / wait / waitFor / webhook).
        schedule:
          type: [object, 'null']
          description: "Recurrence for a scheduled rule (trigger_type schedule.recurring), or null for an event-triggered rule. Scanned daily by the recurring-rule scanner."
          required: [freq]
          properties:
            freq: { type: string, enum: [daily, weekly, monthly] }
            day: { type: integer, description: "weekly: day of week (0 = Sunday). monthly: day of month. Ignored for daily." }
            scope:
              type: string
              enum: [once, perEmployee]
              description: "once = a single firing. perEmployee = one firing per active employee, with the employee bound into the payload."
        last_scheduled_on: { type: string, format: date, readOnly: true, description: "Idempotency stamp: the last date the daily scanner fired this scheduled rule." }
        enabled:
          type: boolean
          description: Whether the rule fires (authoring on/off switch, distinct from the disabled lifecycle flag).
        access: { readOnly: true, $ref: '#/components/schemas/access_hint' }
      x-aep-resource:
        singular: automation
        plural: automations
        patterns: ['automations/{automation_id}']
        type: hrms.example.com/automation
    automation_run:
      type: object
      required: [path, create_time, update_time, etag, event_type, status, start_time]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the automation run.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        automation: { type: string, readOnly: true, description: Path of the automation that fired. }
        event: { type: string, readOnly: true, description: Path of the event-log entry that triggered this run. }
        event_type: { type: string, readOnly: true }
        status: { type: string, readOnly: true, description: done | partial | error | skipped. }
        subject: { type: string, readOnly: true, description: The event's subject resource path. }
        employee: { type: string, readOnly: true, description: Path of the employee the event concerned. }
        correlation_id: { type: string, readOnly: true, description: Trace id shared by every run/event of one root emit. }
        result:
          type: array
          items: { type: object }
          readOnly: true
          description: Per-action outcomes. Redacted to kind+status for non-super viewers.
        start_time: { type: string, format: date-time, readOnly: true }
        end_time: { type: string, format: date-time, readOnly: true }
      x-aep-resource:
        singular: automation-run
        plural: automation-runs
        patterns: ['automation-runs/{run}']
        type: hrms.example.com/automation-run
    workflow_instance:
      type: object
      required: [path, create_time, update_time, etag, status, arms]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the workflow instance.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        automation: { type: string, readOnly: true, description: Path of the automation this durable wait belongs to. }
        status: { type: string, readOnly: true, description: waiting | done | expired | error. }
        awaited_types:
          type: array
          items: { type: string }
          readOnly: true
          description: Event types any arm of this suspended waitFor is listening for.
        arms:
          type: array
          items: { type: object }
          readOnly: true
          description: The waitFor arm definitions (event/timer) as authored.
        origin_type: { type: string, readOnly: true, description: The event type that started the workflow. }
        subject: { type: string, readOnly: true }
        employee: { type: string, readOnly: true, description: Path of the employee the workflow concerns. }
        correlation_id: { type: string, readOnly: true }
        resumed_time: { type: string, format: date-time, readOnly: true }
      x-aep-resource:
        singular: workflow-instance
        plural: workflow-instances
        patterns: ['workflow-instances/{instance}']
        type: hrms.example.com/workflow-instance
    event_log_entry:
      type: object
      required: [path, create_time, update_time, etag, type, payload, occurred_time]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the event-log entry.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        type: { type: string, readOnly: true, description: The domain event type (see workflow-meta events). }
        subject: { type: string, readOnly: true, description: The resource path the event is about. }
        actor: { type: string, readOnly: true, description: Path of the user who caused the event (absent for system). }
        employee: { type: string, readOnly: true, description: Path of the employee the event concerns. }
        correlation_id: { type: string, readOnly: true }
        payload: { type: object, readOnly: true, description: Event payload. Values redacted for non-super viewers. }
        occurred_time: { type: string, format: date-time, readOnly: true }
      x-aep-resource:
        singular: event-log-entry
        plural: event-log
        patterns: ['event-log/{event}']
        type: hrms.example.com/event-log-entry
    workflow_meta:
      type: object
      readOnly: true
      description: Builder metadata for the no-code workflow UI, assembled live from the event and verb catalogs.
      properties:
        path: { type: string, readOnly: true }
        events:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              label: { type: string }
              module: { type: string }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string }
                    type: { type: string }
        resources:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              label: { type: string }
              standard: { type: array, items: { type: string } }
              verbs: { type: array, items: { type: string } }
        recipientKinds: { type: array, items: { type: string } }
        actionKinds: { type: array, items: { type: string } }
        conditionOps: { type: array, items: { type: string } }
      x-aep-resource:
        singular: workflow-meta
        plural: workflow-meta
        singleton: true
        patterns:
          - 'workflow-meta'
        type: hrms.example.com/workflow-meta
    user:
      type: object
      required: [path, create_time, update_time, etag, email]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the resource, unique within the service.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        email: { type: string, format: email, readOnly: true }
        role: { type: string, description: Role value employee/manager/hr_admin/payroll_admin/super_admin. }
        status: { type: string, description: Account status value active/disabled. }
        employee: { type: string, description: "Resource path: employees/{employee_id}" }
        holiday_feed_token: { type: string, readOnly: true, description: "On users/me only: the caller's unguessable token for the public holiday calendar feed at /calendar/holidays/{token}. Present only when the org enabled the feed and the caller has an employee record (never for a simulated principal)." }
        caller_access:
          type: object
          readOnly: true
          description: >-
            Present on the caller's own record (users/me) only. The caller's scope-stripped capability set for
            client-side UI gating. Distinct from the per-object `access` hint every other resource carries:
            this describes the CALLER, not this row.
          properties:
            capabilities:
              type: array
              items: { type: string }
            scopes:
              type: object
              description: Per-collection grantable scope tiers (self/dept/subtree/all) from the policy manifest; drives the ACL scope chips so each access icon offers the relevant scopes.
              additionalProperties:
                type: array
                items: { type: string }
      x-aep-resource:
        singular: user
        plural: users
        patterns:
          - 'users/{user_id}'
        type: hrms.example.com/user
    setting:
      type: object
      required: [path, update_time, etag]
      properties:
        path:
          type: string
          readOnly: true
          description: The path of the org setting (settings/{key}).
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        key: { type: string, description: The setting key. }
        value: { type: object, description: Opaque org setting value (JSON). }
      x-aep-resource:
        singular: setting
        plural: settings
        patterns:
          - 'settings/{setting_id}'
        type: hrms.example.com/setting
    preference:
      type: object
      required: [path, create_time, update_time, etag]
      properties:
        path:
          type: string
          readOnly: true
          description: The caller-scoped path of the preference (preferences/{key}).
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        key: { type: string, description: The preference key. }
        value: { type: object, description: Opaque per-user preference value (JSON). }
      x-aep-resource:
        singular: preference
        plural: preferences
        patterns:
          - 'preferences/{preference_id}'
        type: hrms.example.com/preference
    employee:
      type: object
      required: [path, create_time, update_time, etag]
      properties:
        path:
          type: string
          readOnly: true
          description: The server-assigned path of the resource, unique within the service.
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        delete_time: { type: string, format: date-time, readOnly: true }
        first_name: { type: string }
        last_name: { type: string }
        legal_name: { type: string, description: "Full legal name as on official documents/IDs/bank, distinct from the display first+last name. HR-managed (not self-editable). Used for signing and letter sign-off; falls back to first+last when unset." }
        employee_number: { type: string, description: "Human-facing employee ID (e.g. EMP-0042). Auto-assigned from the org format (settings/employee-number) on create when omitted; HR-overridable (unique). A protected field: not self-writable. Distinct from the opaque wire id." }
        work_email: { type: string, format: email }
        job_title: { type: string }
        bio: { type: string, readOnly: true, maxLength: 280, description: "Short public 'about me' (plain text). Readable by anyone who can read the employee record; written via the owner-writable employees/{employee_id}/bio sub-resource, not this record." }
        department: { type: string, description: "Resource path: departments/{department_id}" }
        manager: { type: string, description: "Resource path: employees/{employee_id}" }
        start_date: { type: string, format: date, description: First working day. Drives leave accrual and probation. }
        probation_end_date: { type: string, format: date, description: Last day of probation. Defaults from start_date plus the org probation period. }
        epf_enrolled: { type: boolean, description: "EPF is opt-in per employee. When false (default) the PF deduction and employer-share CTC line are skipped." }
        eps_excluded: { type: boolean, description: "EPS (Employees' Pension Scheme) exclusion, HR-declared. True for a member whose pay already exceeded the pension wage ceiling when they first joined EPF: the whole employer PF share stays in EPF instead of 8.33% being diverted to the pension fund. Affects the statutory register and the PF challan split only." }
        photo: { type: string, readOnly: true, description: Present when the employee has a profile photo (fetch via :getPhoto). }
        signature: { type: string, readOnly: true, description: "Owner-private. Present (and fetchable via :getSignature) ONLY for the employee themselves; omitted for all other viewers." }
        profile_completeness:
          type: object
          readOnly: true
          description: "Which profile sections have data: the self-service completeness meter on /profile, and a record-quality signal for HR. Present only on a single GET by the employee themselves or a caller holding employees.write; omitted for everyone else (the flags reveal whether e.g. bank data exists). The signature flag is owner-only - stripped for HR, since even its existence is private. Computed from the record the read already loaded - no extra queries."
          properties:
            photo: { type: boolean, description: A profile photo is set. }
            personal: { type: boolean, description: Date of birth and gender are filled in. }
            contact: { type: boolean, description: Personal phone plus at least one address are filled in. }
            emergency: { type: boolean, description: An emergency contact name and phone are filled in. }
            identity: { type: boolean, description: At least one identity field has a value. }
            bank: { type: boolean, description: Bank account number and IFSC are filled in. }
            signature: { type: boolean, description: A signature image is set. }
        disabled: { type: boolean, readOnly: true }
        locked: { type: boolean, readOnly: true }
        locked_by: { type: string, readOnly: true }
        access:
          readOnly: true
          $ref: '#/components/schemas/access_hint'
      x-aep-resource:
        singular: employee
        plural: employees
        patterns:
          - 'employees/{employee_id}'
        type: hrms.example.com/employee
    bank-account:
      type: object
      description: An employee's bank account (singleton). Stored encrypted; the account number is returned masked.
      properties:
        path: { type: string, readOnly: true }
        etag: { type: string, readOnly: true }
        bank_name: { type: string }
        account_name: { type: string, description: Account holder name. }
        account_number: { type: string, writeOnly: true }
        account_number_masked: { type: string, readOnly: true, description: Account number with all but the last four digits masked. }
        ifsc_code: { type: string, description: Branch routing code (IFSC/SWIFT/sort code). }
        currency_code: { type: string }
        on_file: { type: boolean, readOnly: true, description: Whether bank details have been saved for this employee. }
      x-aep-resource:
        singular: bank-account
        plural: bank-accounts
        singleton: true
        patterns:
          - 'employees/{employee_id}/bank-account'
        type: hrms.example.com/bank-account
    identity-field:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        mandatory: { type: boolean, description: Whether this field is required. }
        sensitive: { type: boolean, description: Whether the value is encrypted and returned masked. }
        document: { type: string, description: "Document type this field expects as proof, when the admin configured one." }
        value: { type: string, description: Current value (masked when the field is sensitive). }
        has_value: { type: boolean }
        has_doc: { type: boolean, description: "Whether a supporting document is on file for this field (slot identity:<key>)." }
        denied: { type: boolean, readOnly: true, description: True when the caller is denied read on this specific field; the value is withheld. }
    identity:
      type: object
      required: [path, etag, fields]
      description: An employee's configured identity fields (singleton; PAN/UAN/Aadhaar etc.). Sensitive values are encrypted and returned masked.
      properties:
        path: { type: string, readOnly: true }
        etag: { type: string, readOnly: true }
        fields:
          type: array
          readOnly: true
          description: The configured fields with the employee's current values.
          items: { $ref: '#/components/schemas/identity-field' }
        values:
          type: object
          writeOnly: true
          description: Map of field key to value. A blank value keeps a sensitive field and clears a non-sensitive one.
      x-aep-resource:
        singular: identity
        plural: identities
        singleton: true
        patterns:
          - 'employees/{employee_id}/identity'
        type: hrms.example.com/identity
    tax-slab:
      type: object
      required: [from, rate, amount]
      description: One slab of the computed tax projection. Entirely derived - never sent by a client.
      properties:
        from: { type: number, readOnly: true, description: Lower bound of the slab. }
        to: { type: number, nullable: true, readOnly: true, description: Upper bound; null on the top slab. }
        rate: { type: number, readOnly: true, description: Marginal rate applied within the slab. }
        amount: { type: number, readOnly: true, description: Tax accrued from this slab. }
    tax:
      type: object
      required: [path, regime, regime_label, assessment_year, financial_year, tds_configured, annual_gross, standard_deduction, taxable_income, slabs, income_tax, rebate, income_tax_after_rebate, surcharge, cess, total_tax, deducted_so_far, remaining_months]
      description: An employee's income-tax (TDS) projection for the financial year (new regime). Computed; only the prior-employer declarations are writable.
      properties:
        path: { type: string, readOnly: true }
        on_file: { type: boolean, readOnly: true }
        regime: { type: string, readOnly: true }
        regime_label: { type: string, readOnly: true }
        assessment_year: { type: string, readOnly: true }
        financial_year: { type: string, readOnly: true }
        tds_configured: { type: boolean, readOnly: true }
        annual_gross: { type: number, readOnly: true }
        standard_deduction: { type: number, readOnly: true }
        chapter_via: { type: number, readOnly: true, description: "Total Chapter VI-A deduction this regime allows, from the employee's VERIFIED investment declarations. 0 under the new regime except 80CCD(2)/80CCH." }
        deductions:
          type: array
          readOnly: true
          description: "Per-section view of those declarations: what was verified and how much this regime actually allows (0 for a disallowed section, so the employee can see why)."
          items:
            type: object
            properties:
              section: { type: string, readOnly: true }
              declared: { type: number, readOnly: true }
              allowed: { type: number, readOnly: true }
        taxable_income: { type: number, readOnly: true }
        slabs: { type: array, readOnly: true, items: { $ref: '#/components/schemas/tax-slab' } }
        income_tax: { type: number, readOnly: true }
        rebate: { type: number, readOnly: true }
        income_tax_after_rebate: { type: number, readOnly: true }
        surcharge: { type: number, readOnly: true }
        cess: { type: number, readOnly: true }
        total_tax: { type: number, readOnly: true }
        deducted_so_far: { type: number, readOnly: true }
        remaining_months: { type: integer, readOnly: true }
        employed_months: { type: integer, readOnly: true }
        monthly_tds: { type: number, readOnly: true }
        prior_employer_income: { type: number, readOnly: true, description: Declared prior-employer income (this FY). }
        prior_employer_tds: { type: number, readOnly: true, description: Declared prior-employer TDS (this FY). }
        prior_employer_income_effective: { type: number, readOnly: true, description: Verified prior-employer income actually fed into the projection (0 unless verified). }
        prior_employer_tds_effective: { type: number, readOnly: true, description: Verified prior-employer TDS actually credited toward collection (0 unless verified). }
        verification_status: { type: string, readOnly: true, nullable: true, enum: [DECLARED, VERIFIED, REJECTED], description: Verification state of the declared prior-employer figures; null when nothing is declared. }
        verified_income: { type: number, readOnly: true, nullable: true, description: HR/payroll-accepted prior-employer income. }
        verified_tds: { type: number, readOnly: true, nullable: true, description: HR/payroll-accepted prior-employer TDS. }
        values:
          type: object
          writeOnly: true
          description: >-
            Write body. To DECLARE (owner or HR on behalf): prior_employer_income, prior_employer_tds, assessment_year.
            To VERIFY/REJECT (HR/payroll, and not the subject employee): action=verify|reject, with optional
            verified_income/verified_tds overrides on verify. Only VERIFIED figures affect withholding.
      x-aep-resource:
        singular: tax
        plural: taxes
        singleton: true
        patterns:
          - 'employees/{employee_id}/tax'
        type: hrms.example.com/tax
    celebration:
      type: object
      description: An upcoming birthday or work anniversary. Birthdays carry day + month ONLY (never the birth year).
      required: [employee, name, kind, month, day, in_days]
      properties:
        employee: { type: string, readOnly: true, description: Employee resource reference. }
        name: { type: string, readOnly: true }
        photo: { type: string, readOnly: true, description: "Photo custom-method reference, present when the employee has a photo." }
        kind: { type: string, enum: [birthday, anniversary], readOnly: true }
        month: { type: integer, readOnly: true, description: Month of the occurrence (1-12). }
