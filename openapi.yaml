        etag: { type: string, readOnly: true }
        display_name: { type: string, description: Human label for the key. }
        description: { type: string, nullable: true, description: "What the key is for, and who to ask before revoking it. Optional." }
        owner:
          type: string
          description: "Resource path of the user this key acts as: users/{user_id}. Defaults to the caller."
        prefix: { type: string, readOnly: true, description: "Public lookup handle, also the way to identify a key after its secret is gone." }
        masked_token: { type: string, readOnly: true, description: "Display form, e.g. hrms_ab12cd34_..." }
        scope:
          type: object
          description: The ceiling applied to the owner's authority. Every axis intersects; an empty list denies that axis entirely.
          properties:
            collections:
              description: Allowed collections, or "*" for no restriction.
              oneOf:
                - { type: string, enum: ['*'] }
                - { type: array, items: { type: string } }
            max_level:
              type: string
              enum: [read, write, admin]
              description: Ceiling on the standard-method level. read = the key cannot mutate anything.
            verbs:
              description: Allowed custom methods, or "*" for no restriction.
              oneOf:
                - { type: string, enum: ['*'] }
                - { type: array, items: { type: string } }
        expire_time: { type: string, format: date-time, description: When the key stops working. Omit for a key that never expires. }
        last_used_time: { type: string, format: date-time, readOnly: true, description: "Best-effort, updated at most once every 15 minutes." }
        revoke_time: { type: string, format: date-time, readOnly: true, description: Set by :revoke. A revoked key is retained so the audit trail still resolves it. }
        delete_time: { type: string, format: date-time, readOnly: true, description: "Set by DELETE, which is a soft delete: the key stops authenticating and drops out of the list, but the row is retained so the audit trail still resolves what it did. `:restore` clears it; `?force` purges the record for good." }
        secret:
          type: string
          readOnly: true
          description: The plaintext token. Present ONLY in the create response - it is stored as an HMAC and can never be shown again.
        access:
          readOnly: true
          $ref: '#/components/schemas/access_hint'
      x-aep-resource:
        singular: api-key
        plural: api-keys
        patterns:
          - 'api-keys/{api_key_id}'
        type: hrms.example.com/api-key
  securitySchemes:
    accessJwt:
      type: apiKey
      in: header
      name: Cf-Access-Jwt-Assertion
      description: Cloudflare Access identity token (browser lane, default deployment mode).
    sessionCookie:
      type: apiKey
      in: cookie
      name: hrms_session
      description: Signed session cookie (browser lane, direct Google sign-in mode).
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        API key, as `Authorization: Bearer hrms_<prefix>_<secret>`. The machine lane. A request carrying an
        `hrms_`-shaped bearer is ALWAYS resolved as that key: it never falls back to the browser lanes, so an
        invalid key is a 401 rather than a silent downgrade to the caller's session.
  responses:
    Problem:
      description: Error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
security:
  - accessJwt: []
  - sessionCookie: []
  - bearerAuth: []
paths:
  /v1/api-keys:
    get:
      description: List method for api-key. Soft-deleted keys are omitted unless `show_deleted=true`.
      operationId: ListApiKeys
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
        - { in: query, name: show_deleted, schema: { type: boolean }, description: Include soft-deleted keys alongside the live ones. }
        - { in: query, name: deleted_only, schema: { type: boolean }, description: "Return the soft-deleted keys BY THEMSELVES, so a \"Deleted\" view is its own fetch rather than a filter over a page of mostly-live rows." }
        - { in: query, name: q, schema: { type: string }, description: "Substring match over the key's name, description and public prefix, applied across the whole collection - the way to reach a key beyond the first page." }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/api-key' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      description: Create method for api-key. The response carries the plaintext `secret` exactly once.
      operationId: CreateApiKey
      parameters: [ { in: query, name: id, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/api-key' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/api-key' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/api-keys/{api_key_id}:
    parameters: [ { in: path, name: api_key_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for api-key.
      operationId: GetApiKey
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/api-key' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: >-
        Update method for api-key. Only `display_name` and `description` may be changed: what a key can do
        (`scope`), who it acts as (`owner`) and when it expires are fixed at mint time, so changing a key's
        authority means minting a new one and revoking this. Any other field is rejected.
      operationId: UpdateApiKey
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/api-key' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/api-key' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      description: Delete method for api-key. Permanently removes the credential.
      operationId: DeleteApiKey
      parameters:
        - { in: query, name: force, schema: { type: boolean } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/api-keys/{api_key_id}:revoke:
    post:
      description: "Custom method revoke for api-key. Stops the credential working immediately, keeping the row so the audit trail still resolves it."
      operationId: ":RevokeApiKey"
      parameters: [ { in: path, name: api_key_id, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/api-key' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/users:
    get:
      description: List method for user.
      operationId: ListUsers
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/user' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/users/{user_id}:
    parameters: [ { in: path, name: user_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for user.
      operationId: GetUser
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/user' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: Update method for user.
      operationId: UpdateUser
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/user' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/user' } } } }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/settings:
    get:
      description: List method for setting (org-wide config; readable by all).
      operationId: ListSettings
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/setting' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/settings/{setting_id}:
    parameters: [ { in: path, name: setting_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for setting.
      operationId: GetSetting
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/setting' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: Update method for setting. Upserts the org value for this key (config.write).
      operationId: UpdateSetting
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/setting' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/setting' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/preferences:
    get:
      description: List method for preference (returns the caller's own preferences).
      operationId: ListPreferences
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/preference' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/preferences/{preference_id}:
    parameters: [ { in: path, name: preference_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for preference (the caller's preference for this key).
      operationId: GetPreference
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/preference' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: Update method for preference. Upserts the caller's value for this key.
      operationId: UpdatePreference
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/preference' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/preference' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/roles:
    get:
      description: List method for role (the role catalog).
      operationId: ListRoles
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/role' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      description: Create method for role.
      operationId: CreateRole
      parameters: [ { in: query, name: id, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/role' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/role' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/roles/{role_id}:
    parameters: [ { in: path, name: role_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for role.
      operationId: GetRole
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/role' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: Update method for role (label / protected; the name is immutable).
      operationId: UpdateRole
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/role' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/role' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      description: Delete method for role. Rejected for protected core roles or roles still in use (409).
      operationId: DeleteRole
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/access-rules:
    get:
      description: List method for access-rule (every role and user access rule).
      operationId: ListAccessRules
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/access-rule' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      description: Create method for access-rule (one rule for a role or a user; the server derives the pattern + narrowing). You cannot create or delete rules of the role you are using.
      operationId: CreateAccessRule
      parameters: [ { in: query, name: id, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/access-rule' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/access-rule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /v1/policy:
    get:
      description: List method for policy (global body-access-control manifest documents).
      operationId: ListPolicies
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/policy' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/policy/{policy_id}:
    parameters: [ { in: path, name: policy_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for policy.
      operationId: GetPolicy
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/policy' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: Update method for policy. Strictly validates the manifest shape (a malformed body is rejected).
      operationId: UpdatePolicy
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/policy' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/policy' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/access-rules:preview:
    post:
      description: "Custom method preview: run the authorization engine for the given subject users against one target (collection, optional object/field/verb) and return their effective verdicts - read/write/admin ladder, the asked verb, read-scope provenance, and whether an explicit deny matched. Read-only report; powers the ACL modal's view-as panel and impact warnings. Never an enforcement path."
      operationId: ":PreviewAccessRules"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subjects]
              properties:
                subjects:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string, description: "users/<id> ref, or employees/<id> (resolves to the linked account; a person with no account yet is graded as the default-role account they would get on first sign-in)" }
                collection: { type: string, description: "The target collection. Optional only with include_capabilities (capability-set-only call)." }
                object: { type: string, description: "Optional object ref (<collection>/<id>) to evaluate against one row." }
                field: { type: string, description: "Optional protected-field/sub-resource key; requires object." }
                verb: { type: string, description: "Optional custom method to check alongside the standard ladder." }
                include_capabilities: { type: boolean, description: "Also return each subject's scope-stripped capability set (what /users/me carries) - powers app-wide view-as." }
      responses:
        '200':
          description: Per-subject verdicts, in request order.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: [subject, email, role, disabled, read, write, admin, denied]
                      properties:
                        subject: { type: string }
                        email: { type: string }
                        name: { type: string, nullable: true }
                        role: { type: string }
                        disabled: { type: boolean }
                        read: { type: boolean }
                        write: { type: boolean }
                        admin: { type: boolean }
                        verb_allowed: { type: boolean }
                        why: { type: string, enum: [all, subtree, exact, self, dept] }
                        denied: { type: boolean }
                        capabilities: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/access-rules:requestAccess:
    post:
      description: "Custom method requestAccess: notify every access admin (role holding access-rules.write) that the caller wants access to a collection (optionally a specific method). Fail-closed like any custom method - orgs enable the flow by granting the verb to the everyone role."
      operationId: ":RequestAccessAccessRules"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [collection]
              properties:
                collection: { type: string, description: "The collection access is wanted for." }
                verb: { type: string, description: "Optional custom method being asked for." }
                note: { type: string, maxLength: 500, description: "Optional free-text context shown to the admins." }
      responses:
        '200':
          description: How many admins were notified.
          content:
            application/json:
              schema:
                type: object
                required: [notified]
                properties:
                  notified: { type: integer }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
  /v1/access-rules:approve:
    post:
      description: "Custom method approve: apply a pending permission change (a pending grant goes live; a pending removal deletes the rule). Four eyes - the person who requested the change cannot approve it."
      operationId: ":ApproveAccessRules"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { type: string, description: "access-rules/{access_rule_id} awaiting a decision." }
      responses:
        '200': { description: The decided rule, content: { application/json: { schema: { $ref: '#/components/schemas/access-rule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/access-rules:reject:
    post:
      description: "Custom method reject: turn down a pending permission change (a pending grant is dropped; a pending removal is restored). Four eyes - the requester cannot decide their own request."
      operationId: ":RejectAccessRules"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rule]
              properties:
                rule: { type: string, description: "access-rules/{access_rule_id} awaiting a decision." }
      responses:
        '200': { description: The decided rule, content: { application/json: { schema: { $ref: '#/components/schemas/access-rule' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/access-rules/{access_rule_id}:
    parameters: [ { in: path, name: access_rule_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for access-rule.
      operationId: GetAccessRule
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/access-rule' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      description: Delete method for access-rule (remove the rule). You cannot delete rules of the role you are using.
      operationId: DeleteAccessRule
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/employees:
    get:
      description: List method for employee.
      operationId: ListEmployees
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
        - { in: query, name: show_deleted, schema: { type: boolean } }
        - in: query
          name: q
          schema: { type: string }
          description: "Free-text filter across the collection's indexed fields. Narrows the caller's normal scope; it never widens it. Ignored below 2 characters."
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  results: { type: array, items: { $ref: '#/components/schemas/employee' } }
                  next_page_token: { type: string }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
    post:
      description: Create method for employee.
      operationId: CreateEmployee
      parameters: [ { in: query, name: id, schema: { type: string } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/employee' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/employee' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/employees/{employee_id}:
    parameters: [ { in: path, name: employee_id, required: true, schema: { type: string } } ]
    get:
      description: Get method for employee.
      operationId: GetEmployee
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/employee' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      description: Update method for employee.
      operationId: UpdateEmployee
      requestBody: { required: true, content: { application/merge-patch+json: { schema: { $ref: '#/components/schemas/employee' } } } }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/employee' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      description: Delete method for employee.
      operationId: DeleteEmployee
      parameters:
        - { in: query, name: force, schema: { type: boolean } }
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/operations:
    get:
      description: List method for operation.
      operationId: ListOperations
      parameters:
        - { in: query, name: max_page_size, schema: { type: integer } }
        - { in: query, name: page_token, schema: { type: string } }
      responses:
        '200':
          description: Successful response
          content:
            application/json:
