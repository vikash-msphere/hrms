        end_time: { type: string, format: date-time, description: "Event end instant (a bare YYYY-MM-DD is also accepted on write when all_day)." }
        all_day: { type: boolean, description: "All-day (date-only) event; time-of-day is ignored. Defaults to true." }
        count_as_work: { type: boolean, description: "Count the event's time toward attendees' worked minutes, so it can make a day count as present or half day. When false the event does not excuse the day: an attendee who never clocked in is still absent (loss of pay). Defaults to false." }
        requires_clock_in: { type: boolean, description: "Only meaningful with count_as_work. When true the credit lands only for attendees who actually punched that day; when false it lands regardless. Defaults to false." }
