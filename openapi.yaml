        employee: { type: string, description: "Resource path: employees/{employee_id}" }
        annual_ctc: { type: number, description: "The authoritative figure: annual cost to company. This is the field you set. The server derives the monthly basic (ctc.basic_pct% of the monthly CTC) and a balancing Special Allowance so the full CTC lands on it." }
        base_pay: { type: number, readOnly: true, description: "Derived: the monthly basic the CTC split resolved to (the contractual BASIC payroll and statutory math key off)." }
        special_allowance: { type: number, readOnly: true, description: "Derived: the balancing plug of the split - a monthly taxable earning on top of basic. Absent (0) when the split needs none." }
        currency_code: { type: string }
        pay_grade: { type: string, description: "Resource path: pay-grades/{pay_grade_id} (optional)." }
        pay_grade_name: { type: string, readOnly: true, description: Display name of the assigned grade. }
