                    items:
                      type: object
                      properties:
                        path: { type: string, readOnly: true }
                        action: { type: string }
                        entity: { type: string, description: "Org-wide feed: the touched collection." }
                        entity_ref: { type: string, description: "Org-wide feed: the touched record as a resource path, when it has an id." }
                        actor: { type: string, description: "Resource path: employees/{employee_id} (actor); may be absent for system actions." }
                        actor_email: { type: string }
                        create_time: { type: string, format: date-time }
                        ip: { type: string }
                        user_agent: { type: string }
