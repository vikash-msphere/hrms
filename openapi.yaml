  /v1/announcements:post:
    post:
      description: "Custom method post: create a generic board post (kind=post), or a poll (kind=poll) when `options` are given, authored by the caller. The 'anyone can post' gate, separate from the write-gated announcement create."
      operationId: ":PostAnnouncement"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                body: { type: string, description: "Required for a post; optional for a poll." }
                options:
                  type: array
                  description: "Poll choices (>=2). When present, creates a poll instead of a post."
                  items: { type: string }
                multiple: { type: boolean, description: "Poll only: allow a voter to pick more than one option." }
                closes_time: { type: string, format: date-time, description: "Poll only: optional deadline after which voting is locked." }
                illustration: { type: string, maxLength: 120, description: "Optional art for the card: a `<category>/<slug>` path into the bundled illustration set (e.g. `celebration-recognition/celebrating`) or a `<file>.png` brand sticker. Rejected unless it matches one of those two shapes." }
                title_align: { type: string, enum: [left, center, right], description: "How the card heading is aligned. Omit for start-aligned." }
                body_valign: { type: string, enum: [top, middle, bottom], description: "Where the words sit vertically in the card. Omit for centred." }
                illustration_layout:
                  type: object
                  description: "Where the sticker sits on the card, set once an author has moved, resized or faded it. Absent means the default: the sticker flows inline beside the message. Every value is a FRACTION of the card's own width, never pixels, so one placement holds at any card size."
                  required: [x, y, size, opacity]
                  properties:
                    x: { type: number, description: "Horizontal anchor, 0 (flush left) to 1 (flush right)." }
                    y: { type: number, description: "Vertical anchor, 0 (flush top) to 1 (flush bottom)." }
                    size: { type: number, description: "Width as a share of the card's width (0.05-1)." }
                    opacity: { type: number, description: "0.05 (barely there) to 1 (solid)." }
                    wrap: { type: string, enum: [inline, square, tight, through, top-bottom, behind, front], description: "How the card's words behave around it, in word-processor terms: inline (its own column), square/tight/through (text flows around it, on the side its x favours), top-bottom (its own band, text above and below), behind or front (floating over the card at x/y). Absent = the card's own default." }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/announcement' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
  /v1/announcements:giveKudos:
    post:
      description: "Custom method giveKudos: recognize a colleague - or a whole department - with a kudo (a board post, kind=kudos) authored by the caller. The open recognition-wall gate, separate from posting/announcing. Provide EXACTLY ONE of `recipient` or `recipient_department`. `points` is snapshotted server-side from the level; a department kudo carries no per-head points."
      operationId: ":GiveKudosAnnouncement"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                recipient: { type: string, description: "Resource path: employees/{employee_id} being recognized (mutually exclusive with recipient_department)." }
                recipient_department: { type: string, description: "Resource path: departments/{department_id} recognized as a whole team (mutually exclusive with recipient)." }
                message: { type: string, description: "The kudo message." }
                value: { type: string, description: "Optional company value tag (e.g. Teamwork)." }
                category: { type: string, description: "Optional HR-configurable category (settings/kudos)." }
                level: { type: string, description: "Optional recognition level/tier (settings/kudos)." }
                illustration: { type: string, maxLength: 120, description: "Optional art for the card: a `<category>/<slug>` path into the bundled illustration set (e.g. `celebration-recognition/celebrating`) or a `<file>.png` brand sticker (e.g. `good-job.png`). Rejected unless it matches one of those two shapes; omit for a card with no art." }
                illustration_layout:
                  type: object
                  description: "Where the sticker sits on the card, set once an author has moved, resized or faded it. Absent means the default: the sticker flows inline beside the message. Every value is a FRACTION of the card's own width, never pixels, so one placement holds at any card size."
                  required: [x, y, size, opacity]
                  properties:
                    x: { type: number, description: "Horizontal anchor, 0 (flush left) to 1 (flush right)." }
                    y: { type: number, description: "Vertical anchor, 0 (flush top) to 1 (flush bottom)." }
                    size: { type: number, description: "Width as a share of the card's width (0.05-1)." }
                    opacity: { type: number, description: "0.05 (barely there) to 1 (solid)." }
                    wrap: { type: string, enum: [inline, square, tight, through, top-bottom, behind, front], description: "How the card's words behave around it, in word-processor terms: inline (its own column), square/tight/through (text flows around it, on the side its x favours), top-bottom (its own band, text above and below), behind or front (floating over the card at x/y). Absent = the card's own default." }
                recipient_layout:
                  type: object
                  description: "Where the recipient block (avatar + name) sits and how wide it is, once placed. Fractions of the card's width, 0 flush left/top to 1 flush right/bottom."
                  required: [x, y, size]
                  properties:
                    x: { type: number }
                    y: { type: number }
                    size: { type: number }
                    wrap: { type: string, enum: [inline, square, tight, through, top-bottom, behind, front], description: "How the card's words behave around it, in word-processor terms: inline (its own column), square/tight/through (text flows around it, on the side its x favours), top-bottom (its own band, text above and below), behind or front (floating over the card at x/y). Absent = the card's own default." }
                body_valign: { type: string, enum: [top, middle, bottom], description: "Where the message sits vertically in the card. Omit for centred." }
      responses:
        '200': { description: Successful response, content: { application/json: { schema: { $ref: '#/components/schemas/announcement' } } } }
        '400': { $ref: '#/components/responses/Problem' }
        '500': { $ref: '#/components/responses/Problem' }
