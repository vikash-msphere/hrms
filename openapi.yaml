    asset:
      type: object
      description: A company asset (laptop, phone, etc.). Org inventory; assigned_to ties it to an employee, whose profile lists their assigned assets. POST adds one; PATCH edits / assigns / returns it.
      required: [path, create_time, update_time, etag]
      properties:
        path: { type: string, readOnly: true }
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        asset_tag: { type: string, description: "Human-facing tag printed on the sticker, e.g. MS-LAP-014. Allocated on create from settings/asset-tags and the category's tag_code; unique. Send one to override it; it cannot be cleared." }
        name: { type: string, description: "Display name, e.g. MacBook Pro 14." }
        category: { type: string, description: "Resource path: asset-categories/{category_id}. Decides the tag_code the allocated asset_tag carries." }
        serial_number: { type: string }
        status: { type: string, description: "pending_verification | in_stock | pending_ack | assigned | repair | retired. The two pending states mean nobody has scanned the tag yet. Only :verify and :acknowledge produce the proven states: sending in_stock or assigned (on POST or PATCH alike) lands on the pending state that precedes it. repair and retired are set directly." }
        assigned_to: { type: string, description: "Resource path: employees/{employee_id} (omitted when in stock)." }
        assigned_on: { type: string, format: date, description: "Date the asset was assigned." }
        purchase_date: { type: string, format: date }
        tag_printed_time: { type: string, format: date-time, readOnly: true, description: "Last time a physical sticker tag was printed for this asset (set by :printTag)." }
        last_verified_time: { type: string, format: date-time, readOnly: true, description: "Last time the physical asset was sighted. Owned by :verify - not writable, so a sighting cannot be claimed without a scan." }
        last_verified_by: { type: string, readOnly: true, description: "Resource path of the employee who recorded the last sighting (employees/{employee_id})." }
        last_verified_scanned: { type: boolean, readOnly: true, description: "Whether the last sighting was proved by scanning the tag, or ticked off by hand (destroyed sticker). Absent when never sighted." }
        last_stocktake: { type: string, readOnly: true, description: "Resource path of the inventory count that claimed the last sighting (stocktakes/{stocktake_id}), if it happened during one." }
        acknowledged_time: { type: string, format: date-time, readOnly: true, description: "When the current holder confirmed receipt by scanning the tag (:acknowledge)." }
        pending_since_time: { type: string, format: date-time, readOnly: true, description: "When the current pending_verification / pending_ack wait began; drives the chase-up reminders." }
        condition: { type: string, readOnly: true, description: "Condition last reported by a scan: good | damaged | missing_parts." }
        tag_secret: { type: string, readOnly: true, description: "Nonce printed inside the QR that makes a scan proof of possession. Served ONLY to a caller who may :printTag this asset." }
        notes: { type: string }
        access: { readOnly: true, $ref: '#/components/schemas/access_hint' }
      x-aep-resource:
        singular: asset
        plural: assets
        patterns: ['assets/{asset_id}']
        type: hrms.example.com/asset
    asset_scan:
      type: object
      description: >-
        Body of the two custody verbs (:verify, :acknowledge). `scan` is the raw string the camera, USB wedge
        or deep link produced - the server matches it against the asset's tag secret, wire id or asset tag, so
        the client never decides what counts as proof.
      properties:
        scan: { type: string, maxLength: 500, description: "The raw scanned payload." }
        condition: { type: string, description: "What the scanner saw: good | damaged | missing_parts." }
        note: { type: string, maxLength: 1000, description: "Free text; required when confirming without a scan." }
        stocktake: { type: string, description: "Resource path: stocktakes/{stocktake_id}. File this sighting against an open count (:verify only). The count must be open, or the call fails." }
        override: { type: boolean, description: "Confirm without a scan (destroyed sticker). Always allowed on :verify with a note; on :acknowledge only when the org sets custody.manual_ack_allowed." }
    stocktake:
      type: object
      description: >-
        One physical walk-through of the inventory. It holds no sightings of its own - those are the
        last_verified_* stamps :verify writes on each asset - so what lives here is the frame (who is counting,
        from when, over what scope), the scans that matched nothing, and, once :close has run, the frozen
        result. Closing is one-way: another walk is another row.
      required: [path, create_time, update_time, etag, status, start_time]
      properties:
        path: { type: string, readOnly: true }
        create_time: { type: string, format: date-time, readOnly: true }
        update_time: { type: string, format: date-time, readOnly: true }
        etag: { type: string, readOnly: true }
        delete_time: { type: string, format: date-time, readOnly: true }
        label: { type: string, description: "What this count is called, e.g. Q3 2026 - Bengaluru office." }
        status: { type: string, readOnly: true, description: "open | closed. Owned by :close - a count cannot be reopened." }
        scope:
          type: object
          description: "What the walk expects to sight. Both lists are optional; an empty scope counts the whole inventory. A closed count cannot be re-scoped."
          properties:
            statuses: { type: array, items: { type: string }, description: "Asset statuses in scope (pending_verification | in_stock | pending_ack | assigned | repair | retired)." }
            categories: { type: array, items: { type: string }, description: "Resource paths: asset-categories/{category_id}." }
        started_by: { type: string, readOnly: true, description: "Resource path of the employee who started the count." }
        start_time: { type: string, format: date-time, readOnly: true, description: "When the count began. An asset sighted at or after this instant counts as sighted in it." }
        closed_by: { type: string, readOnly: true }
        closed_time: { type: string, format: date-time, readOnly: true }
        found:
          type: array
          readOnly: true
          description: "Scans that matched no asset (:recordFound) - the 'there is kit here nobody recorded' findings."
          items:
            type: object
            properties:
              scan_time: { type: string, format: date-time }
              by: { type: string, description: "employees/{employee_id}" }
              raw: { type: string, description: "The scanned payload, verbatim." }
              note: { type: string }
        result:
          type: object
          readOnly: true
          description: >-
            The frozen result, written by :close. Stored rather than derived: a live missing list rots as assets
            are retired, reassigned or scanned later, so a closed count would stop being reproducible.
          properties:
            counts:
              type: object
              properties:
                scope_total: { type: integer }
                sighted: { type: integer }
                scanned: { type: integer, description: "Sightings proved by a scan." }
                unscanned: { type: integer, description: "Sightings ticked off by hand." }
                flagged: { type: integer, description: "Sighted but reported damaged / missing parts." }
                missing: { type: integer }
                found: { type: integer }
            missing:
              type: array
              description: "The missing assets, as they read at the moment of closing."
              items:
                type: object
                properties:
                  asset: { type: string, description: "assets/{asset_id}" }
                  asset_tag: { type: string }
                  name: { type: string }
                  category: { type: string, description: "asset-categories/{category_id}" }
                  status: { type: string }
                  assigned_to: { type: string, description: "employees/{employee_id}" }
                  last_verified_time: { type: string, format: date-time }
            missing_truncated: { type: integer, description: "Missing rows beyond the snapshot cap that were not stored, so a truncated report never reads as a complete one." }
            sighted:
              type: array
              description: >-
                What the walk saw, frozen at close. Cannot be derived afterwards: an asset's last_stocktake
                names whichever count claimed its LATEST sighting, so the next walk would take this one's
                evidence away. Ordered weakest-proof first (hand-ticked and flagged rows), so a truncated
                snapshot keeps the rows worth re-reading.
              items:
                type: object
                properties:
                  asset: { type: string, description: "assets/{asset_id}" }
                  asset_tag: { type: string }
                  name: { type: string }
                  category: { type: string, description: "asset-categories/{category_id}" }
                  status: { type: string, description: "The status the sighting left it in (a check-in leaves it in_stock)." }
                  assigned_to: { type: string, description: "employees/{employee_id}" }
                  sighted_time: { type: string, format: date-time }
                  sighted_by: { type: string, description: "employees/{employee_id}" }
                  scanned: { type: boolean, description: "True when a scan proved it; false when it was ticked off by hand." }
                  condition: { type: string, description: "What the scanner reported: good | damaged | missing_parts." }
            sighted_truncated: { type: integer, description: "Sighted rows beyond the snapshot cap that were not stored." }
            notify_truncated: { type: integer, description: "Held assets beyond the event cap whose holder was not notified." }
            found: { type: array, items: { type: object } }
        notes: { type: string }
        access: { readOnly: true, $ref: '#/components/schemas/access_hint' }
      x-aep-resource:
        singular: stocktake
        plural: stocktakes
        patterns: ['stocktakes/{stocktake_id}']
        type: hrms.example.com/stocktake
    stocktake_found:
      type: object
      description: "Body of :recordFound - something was scanned (or seen) that the inventory does not know about. At least one of the two fields is required."
      properties:
        scan: { type: string, maxLength: 500, description: "The raw scanned payload, kept verbatim." }
        note: { type: string, maxLength: 1000, description: "What was found, in words." }
    stocktake_close:
      type: object
      description: "Body of :close. The result is computed server-side from the asset rows; the only input is an optional closing note."
      properties:
        notes: { type: string, maxLength: 2000 }
